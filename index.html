<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Cloud Analyzer</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fadeIn { animation: fadeIn 0.5s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // Firebase modules from CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Потрібно замінити ці дані на ваші власні з Firebase Console, 
        // якщо ви запускаєте це поза середовищем Canvas
        const firebaseConfig = {
          apiKey: "AIzaSyBS2l3YDALmcy55e74iv5SHYT4bC856A6o",
          authDomain: "analizator-2a3da.firebaseapp.com",
          projectId: "analizator-2a3da",
          storageBucket: "analizator-2a3da.firebasestorage.app",
          messagingSenderId: "199136096822",
          appId: "1:199136096822:web:769dbc75472dc9dd145e97",
          measurementId: "G-NL31X68D2N"
        };

        // Спроба отримати конфіг з оточення Canvas або використовувати дефолт
        const finalConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(finalConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'price-analyzer-external';

        // Простий проксі для іконок Lucide в React
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const [iconHtml, setIconHtml] = useState('');
            useEffect(() => {
                if (window.lucide) {
                    const icon = window.lucide.icons[name];
                    if (icon) setIconHtml(icon.toSvg({ class: className }));
                }
            }, [name, className]);
            return <span dangerouslySetInnerHTML={{ __html: iconHtml }} />;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [suppliers, setSuppliers] = useState([]);
            const [activeSupplierId, setActiveSupplierId] = useState(null);
            const [newSupplierName, setNewSupplierName] = useState('');
            const [isAddingSupplier, setIsAddingSupplier] = useState(false);
            const [analysisResults, setAnalysisResults] = useState([]);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [newManualCategory, setNewManualCategory] = useState('');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribeAuth = onAuthStateChanged(auth, (u) => {
                    if (u) {
                        setUser(u);
                    } else {
                        signInAnonymously(auth).catch(console.error);
                    }
                });
                return () => unsubscribeAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const suppliersCol = collection(db, 'artifacts', currentAppId, 'users', user.uid, 'suppliers');
                const unsubscribe = onSnapshot(suppliersCol, (snapshot) => {
                    const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    setSuppliers(docs);
                    if (docs.length > 0 && !activeSupplierId) setActiveSupplierId(docs[0].id);
                    setLoading(false);
                }, (err) => {
                    console.error(err);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [user]);

            const activeSupplier = useMemo(() => 
                suppliers.find(s => s.id === activeSupplierId) || null
            , [suppliers, activeSupplierId]);

            const addSupplier = async () => {
                if (!newSupplierName.trim() || !user) return;
                const id = Date.now().toString();
                await setDoc(doc(db, 'artifacts', currentAppId, 'users', user.uid, 'suppliers', id), {
                    name: newSupplierName,
                    categories: [],
                    updatedAt: new Date().toISOString()
                });
                setActiveSupplierId(id);
                setNewSupplierName('');
                setIsAddingSupplier(false);
            };

            const addCategory = async (name) => {
                if (!activeSupplier || !name.trim() || activeSupplier.categories.includes(name)) return;
                const updated = [...activeSupplier.categories, name];
                const ref = doc(db, 'artifacts', currentAppId, 'users', user.uid, 'suppliers', activeSupplierId);
                await updateDoc(ref, { categories: updated });
                setAnalysisResults(prev => prev.filter(c => c !== name));
            };

            const removeCategory = async (name) => {
                const updated = activeSupplier.categories.filter(c => c !== name);
                const ref = doc(db, 'artifacts', currentAppId, 'users', user.uid, 'suppliers', activeSupplierId);
                await updateDoc(ref, { categories: updated });
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file || !activeSupplier) return;
                setIsAnalyzing(true);
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, { type: 'binary' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(ws);
                    const firstRow = data[0] || {};
                    const key = Object.keys(firstRow).find(k => 
                        ['категорія', 'category', 'група', 'тип'].some(s => k.toLowerCase().includes(s))
                    );
                    if (!key) {
                        alert('Колонку не знайдено');
                        setIsAnalyzing(false);
                        return;
                    }
                    const found = [...new Set(data.map(r => r[key]?.toString().trim()).filter(Boolean))];
                    setAnalysisResults(found.filter(c => !activeSupplier.categories.includes(c)));
                    setIsAnalyzing(false);
                };
                reader.readAsBinaryString(file);
            };

            if (loading) return (
                <div className="min-h-screen flex items-center justify-center">
                    <div className="text-center">
                        <div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                        <p className="text-slate-500">Завантаження...</p>
                    </div>
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8 animate-fadeIn">
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-indigo-900 flex items-center gap-2">
                                <Icon name="FileSearch" className="w-8 h-8 text-indigo-600" />
                                Price Cloud Analyzer
                            </h1>
                            <p className="text-slate-500">Система відстеження нових категорій</p>
                        </div>
                        <button onClick={() => setIsAddingSupplier(true)} className="bg-indigo-600 text-white px-5 py-2.5 rounded-xl flex items-center gap-2 shadow-md hover:bg-indigo-700 transition-all">
                            <Icon name="Plus" /> Додати постачальника
                        </button>
                    </header>

                    <div className="flex flex-wrap gap-2 mb-6 border-b">
                        {suppliers.map(s => (
                            <button key={s.id} onClick={() => setActiveSupplierId(s.id)} className={`px-6 py-3 font-semibold text-sm rounded-t-xl border-x border-t transition-all ${activeSupplierId === s.id ? 'bg-white text-indigo-600 border-slate-200 -mb-px shadow-sm' : 'text-slate-400 border-transparent hover:bg-slate-100'}`}>
                                {s.name}
                            </button>
                        ))}
                    </div>

                    {activeSupplier ? (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div className="bg-white rounded-2xl shadow-sm border p-6 flex flex-col h-[600px]">
                                <h2 className="font-bold mb-4 flex items-center gap-2 italic text-slate-700">
                                    <Icon name="Settings" className="text-indigo-500" /> База категорій ({activeSupplier.categories.length})
                                </h2>
                                <div className="flex gap-2 mb-4">
                                    <input value={newManualCategory} onChange={e => setNewManualCategory(e.target.value)} onKeyDown={e => e.key === 'Enter' && addCategory(newManualCategory)} className="flex-1 px-4 py-2 bg-slate-50 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Нова категорія..." />
                                    <button onClick={() => addCategory(newManualCategory)} className="bg-indigo-50 text-indigo-600 p-2 rounded-xl border border-indigo-100"><Icon name="Plus" /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2">
                                    {activeSupplier.categories.map(c => (
                                        <div key={c} className="flex justify-between p-3 bg-slate-50 rounded-xl group">
                                            <span className="text-sm">{c}</span>
                                            <button onClick={() => removeCategory(c)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"><Icon name="Trash2" className="w-4 h-4" /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div className="bg-white rounded-2xl shadow-sm border p-6">
                                    <h2 className="font-bold mb-4 flex items-center gap-2 italic text-slate-700"><Icon name="Upload" className="text-indigo-500" /> Завантажити Excel</h2>
                                    <div className="relative border-2 border-dashed rounded-2xl p-8 text-center hover:bg-indigo-50 transition-all group">
                                        <input type="file" accept=".xlsx,.xls" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
                                        <Icon name="Upload" className="mx-auto mb-2 text-indigo-400 group-hover:scale-110 transition-transform" />
                                        <p className="text-sm font-medium">Натисніть або перетягніть файл</p>
                                    </div>
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border p-6 flex flex-col min-h-[300px]">
                                    <h2 className="font-bold mb-4 flex items-center gap-2 italic text-slate-700"><Icon name="AlertCircle" className="text-amber-500" /> Знайдено нових: {analysisResults.length}</h2>
                                    <div className="flex-1 overflow-y-auto space-y-2">
                                        {analysisResults.map(c => (
                                            <div key={c} className="flex justify-between p-3 bg-amber-50 border border-amber-100 rounded-xl">
                                                <span className="text-sm font-bold text-amber-900">{c}</span>
                                                <button onClick={() => addCategory(c)} className="bg-amber-500 text-white p-1 rounded-lg"><Icon name="Plus" className="w-4 h-4" /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="text-center py-20 bg-white rounded-3xl border shadow-sm">
                            <Icon name="Users" className="w-16 h-16 mx-auto mb-4 text-indigo-100" />
                            <h2 className="text-xl font-bold">Створіть першого постачальника</h2>
                        </div>
                    )}

                    {isAddingSupplier && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl">
                                <h3 className="text-xl font-bold mb-4">Назва постачальника</h3>
                                <input autoFocus value={newSupplierName} onChange={e => setNewSupplierName(e.target.value)} className="w-full px-5 py-4 bg-slate-100 rounded-2xl mb-6 outline-none focus:ring-2 focus:ring-indigo-500 text-lg" placeholder="Наприклад: ERC" />
                                <div className="flex justify-end gap-4">
                                    <button onClick={() => setIsAddingSupplier(false)} className="px-6 py-2 text-slate-400 font-bold">Скасувати</button>
                                    <button onClick={addSupplier} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold">Створити</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
