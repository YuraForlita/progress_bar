<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Cloud Analyzer</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <script type="module">
        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        window.FirebaseSDK = { 
            initializeApp, getApp, getApps, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken,
            getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, deleteDoc, query 
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const size = className.includes('w-8') ? "32" : className.includes('w-4') ? "16" : "20";
            const icons = {
                FileSearch: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><circle cx="10" cy="15" r="3"/><path d="m13 18-1.5-1.5"/></svg>,
                Database: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>,
                Plus: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
                Settings: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
                Trash2: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
                Hash: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>,
                Upload: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
                Check: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>,
                AlertCircle: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            };
            return <span className="inline-flex shrink-0">{icons[name] || null}</span>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [suppliers, setSuppliers] = useState([]);
            const [activeSupplierId, setActiveSupplierId] = useState(null);
            const [newSupplierName, setNewSupplierName] = useState('');
            const [isAddingSupplier, setIsAddingSupplier] = useState(false);
            const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);
            const [analysisResults, setAnalysisResults] = useState([]);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [newManualCategory, setNewManualCategory] = useState('');
            const [loading, setLoading] = useState(true);

            const defaultCfg = {
                apiKey: "AIzaSyBS2l3YDALmcy55e74iv5SHYT4bC856A6o",
                authDomain: "analizator-2a3da.firebaseapp.com",
                projectId: "analizator-2a3da",
                storageBucket: "analizator-2a3da.firebasestorage.app",
                messagingSenderId: "199136096822",
                appId: "1:199136096822:web:769dbc75472dc9dd145e97",
                measurementId: "G-NL31X68D2N"
            };

            const [db, setDb] = useState(null);

            const initFirebase = async (customConfig = null) => {
                if (!window.FirebaseSDK) { setTimeout(() => initFirebase(customConfig), 200); return; }
                setLoading(true);
                const { initializeApp, getApp, getApps, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, getFirestore } = window.FirebaseSDK;
                try {
                    const firebaseConfig = customConfig || (typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultCfg);
                    const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
                    const _auth = getAuth(app);
                    const _db = getFirestore(app);
                    setDb(_db);
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { await signInWithCustomToken(_auth, __initial_auth_token); } 
                    else { await signInAnonymously(_auth); }
                    onAuthStateChanged(_auth, setUser);
                } catch (e) { console.error(e); } finally { setLoading(false); }
            };

            useEffect(() => { initFirebase(); }, []);

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'price-analyzer-app';

            useEffect(() => {
                if (!user || !db) return;
                const { collection, onSnapshot } = window.FirebaseSDK;
                const q = collection(db, 'artifacts', appId, 'users', user.uid, 'suppliers');
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    setSuppliers(data);
                    if (data.length > 0 && !activeSupplierId) setActiveSupplierId(data[0].id);
                });
                return () => unsubscribe();
            }, [user, db, activeSupplierId]);

            const activeSupplier = useMemo(() => suppliers.find(s => s.id === activeSupplierId) || null, [suppliers, activeSupplierId]);

            const updateTargetColumn = async (val) => {
                if (!activeSupplier || !db || !user) return;
                const { doc, updateDoc } = window.FirebaseSDK;
                const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'suppliers', activeSupplierId);
                await updateDoc(ref, { targetColumn: val });
            };

            const addSupplier = async () => {
                if (!newSupplierName.trim() || !user || !db) return;
                const { doc, setDoc } = window.FirebaseSDK;
                const id = Date.now().toString();
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'suppliers', id), {
                    name: newSupplierName, categories: [], targetColumn: 'Категорія', updatedAt: new Date().toISOString()
                });
                setActiveSupplierId(id);
                setNewSupplierName('');
                setIsAddingSupplier(false);
            };

            const addCategory = async (name) => {
                if (!activeSupplier || !name || !name.trim() || !db || !user) return;
                const trimmed = name.trim();
                if (activeSupplier.categories.includes(trimmed)) return;
                const { doc, updateDoc } = window.FirebaseSDK;
                const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'suppliers', activeSupplierId);
                await updateDoc(ref, { categories: [...activeSupplier.categories, trimmed] });
                setAnalysisResults(prev => prev.filter(c => c !== trimmed));
                setNewManualCategory('');
            };

            const removeCategory = async (name) => {
                if (!activeSupplier || !db || !user) return;
                const { doc, updateDoc } = window.FirebaseSDK;
                const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'suppliers', activeSupplierId);
                await updateDoc(ref, { categories: activeSupplier.categories.filter(c => c !== name) });
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file || !activeSupplier) return;
                setIsAnalyzing(true);
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = XLSX.read(evt.target.result, { type: 'binary' });
                        const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                        if (data.length === 0) return;

                        const userColumn = (activeSupplier.targetColumn || '').trim().toLowerCase();
                        const allKeys = Object.keys(data[0]);
                        
                        // ЛОГІКА ПОШУКУ СТОВПЦЯ:
                        // 1. Спочатку шукаємо точний збіг того, що ввів користувач
                        let key = allKeys.find(k => k.trim().toLowerCase() === userColumn);
                        
                        // 2. Якщо не знайдено, шукаємо за замовчуванням (категорія)
                        if (!key) {
                            key = allKeys.find(k => ['категорія', 'category'].some(s => k.toLowerCase().includes(s)));
                        }

                        if (!key) {
                            alert(`Стовпець "${activeSupplier.targetColumn}" не знайдено у файлі.`);
                            setIsAnalyzing(false);
                            return;
                        }

                        const found = [...new Set(data.map(r => r[key]?.toString().trim()).filter(val => val && val !== ""))];
                        setAnalysisResults(found.filter(c => !activeSupplier.categories.includes(c)));
                    } catch (err) {
                        console.error(err);
                    } finally { setIsAnalyzing(false); }
                };
                reader.readAsBinaryString(file);
                e.target.value = null; // Reset file input
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8 animate-fadeIn">
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                        <h1 className="text-3xl font-bold text-indigo-900 flex items-center gap-2">
                            <Icon name="FileSearch" className="w-8 h-8 text-indigo-600" /> Price Cloud Analyzer
                        </h1>
                        <div className="flex gap-2">
                            <button onClick={() => setIsAddingSupplier(true)} className="bg-indigo-600 text-white px-5 py-2 rounded-xl flex items-center gap-2 shadow-md hover:bg-indigo-700 font-bold transition-all">
                                <Icon name="Plus" className="w-4 h-4" /> Постачальник
                            </button>
                        </div>
                    </header>

                    <div className="flex flex-wrap gap-2 mb-6 border-b overflow-x-auto pb-1">
                        {suppliers.map(s => (
                            <button key={s.id} onClick={() => {setActiveSupplierId(s.id); setAnalysisResults([]);}} className={`px-6 py-3 font-semibold text-sm rounded-t-xl transition-all whitespace-nowrap ${activeSupplierId === s.id ? 'bg-white text-indigo-600 border-x border-t border-slate-200 -mb-px shadow-sm' : 'text-slate-400 hover:bg-slate-100'}`}>
                                {s.name}
                            </button>
                        ))}
                    </div>

                    {activeSupplier ? (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div className="space-y-6">
                                <div className="bg-white rounded-2xl shadow-sm border p-6 flex flex-col h-[550px]">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="font-bold flex items-center gap-2 text-slate-700"><Icon name="Settings" className="text-indigo-500 w-5 h-5" /> База відборів</h2>
                                        <span className="bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded text-xs font-bold">{activeSupplier.categories.length}</span>
                                    </div>
                                    <div className="flex gap-2 mb-4">
                                        <input value={newManualCategory} onChange={e => setNewManualCategory(e.target.value)} onKeyDown={e => e.key === 'Enter' && addCategory(newManualCategory)} className="flex-1 px-4 py-2 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Додати значення..." />
                                        <button onClick={() => addCategory(newManualCategory)} className="bg-indigo-50 text-indigo-600 p-2 rounded-xl hover:bg-indigo-100 transition-colors"><Icon name="Plus" className="w-5 h-5" /></button>
                                    </div>
                                    <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                                        {activeSupplier.categories.sort((a,b) => a.localeCompare(b)).map(c => (
                                            <div key={c} className="flex justify-between items-center p-3 bg-slate-50 border border-transparent hover:border-slate-200 rounded-xl group transition-all">
                                                <span className="text-sm font-medium">{c}</span>
                                                <button onClick={() => removeCategory(c)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"><Icon name="Trash2" className="w-4 h-4" /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border p-6">
                                    <h2 className="font-bold mb-4 flex items-center gap-2 text-slate-700"><Icon name="Hash" className="text-indigo-500 w-5 h-5" /> Цільовий стовпець в Excel</h2>
                                    <input value={activeSupplier.targetColumn || ''} onChange={e => updateTargetColumn(e.target.value)} className="w-full px-4 py-3 bg-slate-50 border-2 border-indigo-50 rounded-xl focus:border-indigo-500 outline-none text-sm font-bold text-indigo-900" placeholder="Наприклад: Бренд або Категорія..." />
                                    <p className="text-[10px] text-slate-400 mt-2 uppercase tracking-wider font-bold">Програма шукатиме саме це ім'я у файлі</p>
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div className="bg-white rounded-2xl shadow-sm border p-6">
                                    <h2 className="font-bold mb-4 flex items-center gap-2 text-slate-700"><Icon name="Upload" className="text-indigo-500 w-5 h-5" /> Аналіз прайсу</h2>
                                    <div className="relative border-2 border-dashed border-indigo-100 rounded-2xl p-10 text-center hover:bg-indigo-50 hover:border-indigo-300 transition-all cursor-pointer group">
                                        <input type="file" accept=".xlsx,.xls" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
                                        <Icon name="Upload" className="mx-auto mb-2 text-indigo-400 group-hover:scale-110 transition-transform w-8 h-8" />
                                        <p className="text-sm font-bold text-slate-600">Завантажте Excel файл</p>
                                        <div className="flex items-center justify-center gap-1 mt-2">
                                            <span className="text-xs text-slate-400">Шукаємо колонку:</span>
                                            <span className="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-bold">{activeSupplier.targetColumn}</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border p-6 flex flex-col h-[380px]">
                                    <h2 className="font-bold mb-4 flex items-center gap-2 text-slate-700"><Icon name="AlertCircle" className="text-amber-500 w-5 h-5" /> Невідомі значення: {analysisResults.length}</h2>
                                    <div className="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-1">
                                        {isAnalyzing ? <div className="text-center py-10 animate-pulse text-slate-400 text-sm italic">Обробка рядків...</div> : 
                                         analysisResults.length === 0 ? (
                                            <div className="flex flex-col items-center justify-center h-full text-slate-300 opacity-50">
                                                <p className="text-xs">Нових даних не виявлено</p>
                                            </div>
                                         ) :
                                         analysisResults.map(c => (
                                            <div key={c} className="flex justify-between items-center p-3 bg-amber-50 border border-amber-100 rounded-xl animate-fadeIn">
                                                <span className="text-sm font-bold text-amber-900">{c}</span>
                                                <button onClick={() => addCategory(c)} title="Додати до бази" className="bg-indigo-600 text-white p-1.5 rounded-lg shadow-sm hover:bg-indigo-700 transition-colors"><Icon name="Check" className="w-4 h-4" /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="text-center py-24 bg-white rounded-3xl border shadow-sm">
                            <h2 className="text-xl font-bold text-slate-400 italic">Створіть першого постачальника, щоб почати роботу</h2>
                        </div>
                    )}

                    {isAddingSupplier && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-[100] animate-fadeIn">
                            <div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl">
                                <h3 className="text-xl font-bold mb-4">Додати постачальника</h3>
                                <input autoFocus value={newSupplierName} onChange={e => setNewSupplierName(e.target.value)} onKeyDown={e => e.key === 'Enter' && addSupplier()} className="w-full px-5 py-4 bg-slate-100 rounded-2xl mb-6 outline-none focus:ring-2 focus:ring-indigo-500 font-medium" placeholder="Назва (напр. Bosch)..." />
                                <div className="flex justify-end gap-4">
                                    <button onClick={() => setIsAddingSupplier(false)} className="px-6 py-2 text-slate-400 font-bold">Скасувати</button>
                                    <button onClick={addSupplier} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold hover:bg-indigo-700 transition-colors shadow-lg">Створити</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
