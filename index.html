<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Cloud Analyzer</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fadeIn { animation: fadeIn 0.5s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <script type="module">
        // Використовуємо ES модулі безпосередньо в браузері
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Робимо Firebase доступним глобально для Babel скрипту
        window.FirebaseSDK = { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore, doc, setDoc, collection, onSnapshot, updateDoc, deleteDoc };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore, doc, setDoc, collection, onSnapshot, updateDoc, deleteDoc } = window.FirebaseSDK;

        // Конфігурація Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyBS2l3YDALmcy55e74iv5SHYT4bC856A6o",
          authDomain: "analizator-2a3da.firebaseapp.com",
          projectId: "analizator-2a3da",
          storageBucket: "analizator-2a3da.firebasestorage.app",
          messagingSenderId: "199136096822",
          appId: "1:199136096822:web:769dbc75472dc9dd145e97",
          measurementId: "G-NL31X68D2N"
        };

        const finalConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(finalConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'price-analyzer-external';

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const [iconHtml, setIconHtml] = useState('');
            useEffect(() => {
                const timer = setInterval(() => {
                    if (window.lucide) {
                        const icon = window.lucide.icons[name];
                        if (icon) {
                            setIconHtml(icon.toSvg({ class: className }));
                            clearInterval(timer);
                        }
                    }
                }, 100);
                return () => clearInterval(timer);
            }, [name, className]);
            return <span dangerouslySetInnerHTML={{ __html: iconHtml }} />;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [suppliers, setSuppliers] = useState([]);
            const [activeSupplierId, setActiveSupplierId] = useState(null);
            const [newSupplierName, setNewSupplierName] = useState('');
            const [isAddingSupplier, setIsAddingSupplier] = useState(false);
            const [analysisResults, setAnalysisResults] = useState([]);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [newManualCategory, setNewManualCategory] = useState('');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribeAuth = onAuthStateChanged(auth, (u) => {
                    if (u) {
                        setUser(u);
                    } else {
                        signInAnonymously(auth).catch(err => console.error("Auth Error:", err));
                    }
                });
                return () => unsubscribeAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const suppliersCol = collection(db, 'artifacts', currentAppId, 'users', user.uid, 'suppliers');
                const unsubscribe = onSnapshot(suppliersCol, (snapshot) => {
                    const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    setSuppliers(docs);
                    if (docs.length > 0 && !activeSupplierId) setActiveSupplierId(docs[0].id);
                    setLoading(false);
                }, (err) => {
                    console.error("Firestore Error:", err);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [user]);

            const activeSupplier = useMemo(() => 
                suppliers.find(s => s.id === activeSupplierId) || null
            , [suppliers, activeSupplierId]);

            const addSupplier = async () => {
                if (!newSupplierName.trim() || !user) return;
                const id = Date.now().toString();
                try {
                    await setDoc(doc(db, 'artifacts', currentAppId, 'users', user.uid, 'suppliers', id), {
                        name: newSupplierName,
                        categories: [],
                        targetColumn: 'категорія', // дефолтна назва стовпця
                        updatedAt: new Date().toISOString()
                    });
                    setActiveSupplierId(id);
                    setNewSupplierName('');
                    setIsAddingSupplier(false);
                } catch (e) { console.error(e); }
            };

            const removeSupplier = async (id) => {
                if (!confirm('Ви впевнені, що хочете видалити цього постачальника?')) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', currentAppId, 'users', user.uid, 'suppliers', id));
                    if (activeSupplierId === id) setActiveSupplierId(null);
                } catch (e) { console.error(e); }
            };

            const updateTargetColumn = async (val) => {
                if (!activeSupplier) return;
                const ref = doc(db, 'artifacts', currentAppId, 'users', user.uid, 'suppliers', activeSupplierId);
                await updateDoc(ref, { targetColumn: val });
            };

            const addCategory = async (name) => {
                if (!activeSupplier || !name.trim() || activeSupplier.categories.includes(name)) return;
                const updated = [...activeSupplier.categories, name];
                const ref = doc(db, 'artifacts', currentAppId, 'users', user.uid, 'suppliers', activeSupplierId);
                await updateDoc(ref, { categories: updated });
                setAnalysisResults(prev => prev.filter(c => c !== name));
                setNewManualCategory('');
            };

            const removeCategory = async (name) => {
                if (!confirm(`Видалити категорію "${name}" з бази відборів?`)) return;
                const updated = activeSupplier.categories.filter(c => c !== name);
                const ref = doc(db, 'artifacts', currentAppId, 'users', user.uid, 'suppliers', activeSupplierId);
                await updateDoc(ref, { categories: updated });
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file || !activeSupplier) return;
                setIsAnalyzing(true);
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = XLSX.read(evt.target.result, { type: 'binary' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const data = XLSX.utils.sheet_to_json(ws);
                        const firstRow = data[0] || {};
                        
                        // Шукаємо вказаний стовпець або пробуємо дефолтні варіанти
                        const targetKey = activeSupplier.targetColumn?.toLowerCase();
                        const key = Object.keys(firstRow).find(k => {
                            if (targetKey && k.toLowerCase() === targetKey) return true;
                            if (!targetKey) return ['категорія', 'category', 'група', 'тип'].some(s => k.toLowerCase().includes(s));
                            return false;
                        });

                        if (!key) {
                            alert(`Стовпець "${activeSupplier.targetColumn}" не знайдено у файлі.`);
                            setIsAnalyzing(false);
                            return;
                        }
                        const found = [...new Set(data.map(r => r[key]?.toString().trim()).filter(Boolean))];
                        setAnalysisResults(found.filter(c => !activeSupplier.categories.includes(c)));
                    } catch (err) {
                        console.error(err);
                    } finally {
                        setIsAnalyzing(false);
                    }
                };
                reader.readAsBinaryString(file);
            };

            if (loading) return (
                <div className="min-h-screen flex items-center justify-center">
                    <div className="text-center">
                        <div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                        <p className="text-slate-500 font-medium">Завантаження бази даних...</p>
                    </div>
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8 animate-fadeIn">
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-indigo-900 flex items-center gap-2">
                                <Icon name="FileSearch" className="w-8 h-8 text-indigo-600" />
                                Price Cloud Analyzer
                            </h1>
                            <p className="text-slate-500">Система автоматизації відбору категорій</p>
                        </div>
                        <button onClick={() => setIsAddingSupplier(true)} className="bg-indigo-600 text-white px-5 py-2.5 rounded-xl flex items-center gap-2 shadow-md hover:bg-indigo-700 transition-all active:scale-95">
                            <Icon name="Plus" /> Додати постачальника
                        </button>
                    </header>

                    <div className="flex flex-wrap gap-2 mb-6 border-b">
                        {suppliers.map(s => (
                            <div key={s.id} className="relative group">
                                <button onClick={() => setActiveSupplierId(s.id)} className={`px-6 py-3 font-semibold text-sm rounded-t-xl border-x border-t transition-all ${activeSupplierId === s.id ? 'bg-white text-indigo-600 border-slate-200 -mb-px shadow-sm' : 'text-slate-400 border-transparent hover:bg-slate-100'}`}>
                                    {s.name}
                                </button>
                                <button onClick={() => removeSupplier(s.id)} className="absolute -top-1 -right-1 bg-red-100 text-red-500 p-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity shadow-sm"><Icon name="X" className="w-3 h-3" /></button>
                            </div>
                        ))}
                    </div>

                    {activeSupplier ? (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div className="space-y-6">
                                <div className="bg-white rounded-2xl shadow-sm border p-6 flex flex-col h-[500px]">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="font-bold flex items-center gap-2 italic text-slate-700">
                                            <Icon name="Settings" className="text-indigo-500" /> База відборів
                                        </h2>
                                        <span className="text-xs bg-indigo-100 text-indigo-600 px-2 py-1 rounded-full font-bold">{activeSupplier.categories.length}</span>
                                    </div>
                                    <div className="flex gap-2 mb-4">
                                        <input value={newManualCategory} onChange={e => setNewManualCategory(e.target.value)} onKeyDown={e => e.key === 'Enter' && addCategory(newManualCategory)} className="flex-1 px-4 py-2 bg-slate-50 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="Вписати категорію вручну..." />
                                        <button onClick={() => addCategory(newManualCategory)} className="bg-indigo-50 text-indigo-600 p-2 rounded-xl border border-indigo-100 hover:bg-indigo-100 transition-colors"><Icon name="Plus" /></button>
                                    </div>
                                    <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                                        {activeSupplier.categories.length === 0 ? (
                                            <div className="flex flex-col items-center justify-center h-full opacity-40">
                                                <Icon name="Inbox" className="w-12 h-12 mb-2" />
                                                <p className="text-sm">Список відборів порожній</p>
                                            </div>
                                        ) : (
                                            activeSupplier.categories.sort().map(c => (
                                                <div key={c} className="flex justify-between items-center p-3 bg-slate-50 border border-transparent hover:border-slate-200 rounded-xl group transition-all">
                                                    <span className="text-sm font-medium pr-2 text-slate-700">{c}</span>
                                                    <button 
                                                        onClick={() => removeCategory(c)} 
                                                        className="text-slate-300 hover:text-red-500 p-1 hover:bg-red-50 rounded-lg transition-all"
                                                        title="Видалити з бази"
                                                    >
                                                        <Icon name="Trash2" className="w-4 h-4" />
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                                
                                <div className="bg-white rounded-2xl shadow-sm border p-6">
                                    <h2 className="font-bold mb-4 flex items-center gap-2 italic text-slate-700"><Icon name="Hash" className="text-indigo-500" /> Налаштування стовпця</h2>
                                    <p className="text-xs text-slate-400 mb-2">Назва колонки в Excel для аналізу</p>
                                    <input 
                                        value={activeSupplier.targetColumn || ''} 
                                        onChange={e => updateTargetColumn(e.target.value)}
                                        className="w-full px-4 py-2 bg-slate-50 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow" 
                                        placeholder="Наприклад: Категорія" 
                                    />
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div className="bg-white rounded-2xl shadow-sm border p-6">
                                    <h2 className="font-bold mb-4 flex items-center gap-2 italic text-slate-700"><Icon name="Upload" className="text-indigo-500" /> Аналіз нового прайсу</h2>
                                    <div className="relative border-2 border-dashed border-slate-200 rounded-2xl p-8 text-center hover:bg-indigo-50 hover:border-indigo-300 transition-all group cursor-pointer">
                                        <input type="file" accept=".xlsx,.xls" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
                                        <Icon name="Upload" className="mx-auto mb-2 text-indigo-400 group-hover:scale-110 transition-transform" />
                                        <p className="text-sm font-bold text-slate-600">Оберіть файл Excel</p>
                                        <p className="text-xs text-slate-400 mt-1">Аналізуємо колонку: <span className="font-bold text-indigo-600">"{activeSupplier.targetColumn || 'категорія'}"</span></p>
                                    </div>
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border p-6 flex flex-col min-h-[300px]">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="font-bold flex items-center gap-2 italic text-slate-700">
                                            <Icon name="AlertCircle" className="text-amber-500" /> 
                                            Нові категорії: {analysisResults.length}
                                        </h2>
                                        {analysisResults.length > 0 && (
                                            <button onClick={() => setAnalysisResults([])} className="text-xs text-slate-400 hover:text-slate-600 font-medium">Очистити</button>
                                        )}
                                    </div>
                                    <div className="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-1">
                                        {isAnalyzing ? (
                                            <div className="flex flex-col items-center justify-center h-full text-slate-400">
                                                <div className="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mb-2"></div>
                                                <p className="text-sm">Аналізуємо...</p>
                                            </div>
                                        ) : analysisResults.length === 0 ? (
                                            <div className="flex flex-col items-center justify-center h-full opacity-40 text-center px-4">
                                                <Icon name="Search" className="w-12 h-12 mb-2" />
                                                <p className="text-sm">Завантажте прайс, щоб побачити категорії, яких ще немає у вашій базі</p>
                                            </div>
                                        ) : (
                                            analysisResults.map(c => (
                                                <div key={c} className="flex justify-between items-center p-3 bg-amber-50 border border-amber-100 rounded-xl hover:shadow-sm transition-all group">
                                                    <span className="text-sm font-bold text-amber-900">{c}</span>
                                                    <div className="flex gap-1">
                                                        <button 
                                                            onClick={() => setAnalysisResults(prev => prev.filter(item => item !== c))} 
                                                            className="p-1.5 text-amber-400 hover:text-amber-600 rounded-lg transition-colors"
                                                            title="Приховати"
                                                        >
                                                            <Icon name="X" className="w-4 h-4" />
                                                        </button>
                                                        <button 
                                                            onClick={() => addCategory(c)} 
                                                            className="bg-indigo-600 hover:bg-indigo-700 text-white p-1.5 rounded-lg transition-all shadow-sm active:scale-95"
                                                            title="Додати до бази"
                                                        >
                                                            <Icon name="Check" className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="text-center py-20 bg-white rounded-3xl border shadow-sm flex flex-col items-center">
                            <Icon name="Users" className="w-16 h-16 mb-4 text-indigo-100" />
                            <h2 className="text-xl font-bold text-slate-800">Оберіть постачальника</h2>
                            <p className="text-slate-400 mb-6">Або створіть нового для початку аналізу</p>
                            <button onClick={() => setIsAddingSupplier(true)} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition-all">Створити зараз</button>
                        </div>
                    )}

                    {isAddingSupplier && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
                            <div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl">
                                <h3 className="text-xl font-bold mb-2">Новий постачальник</h3>
                                <p className="text-sm text-slate-400 mb-6">Введіть назву компанії</p>
                                <input autoFocus value={newSupplierName} onChange={e => setNewSupplierName(e.target.value)} onKeyDown={e => e.key === 'Enter' && addSupplier()} className="w-full px-5 py-4 bg-slate-100 rounded-2xl mb-6 outline-none focus:ring-2 focus:ring-indigo-500 text-lg transition-all" placeholder="Назва..." />
                                <div className="flex justify-end gap-4">
                                    <button onClick={() => setIsAddingSupplier(false)} className="px-6 py-2 text-slate-400 font-bold hover:text-slate-600 transition-colors">Скасувати</button>
                                    <button onClick={addSupplier} disabled={!newSupplierName.trim()} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold hover:bg-indigo-700 disabled:opacity-50 transition-all shadow-md">Додати</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const checkFirebaseAndRender = () => {
            if (window.FirebaseSDK) {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(<App />);
            } else {
                setTimeout(checkFirebaseAndRender, 50);
            }
        };
        checkFirebaseAndRender();
    </script>
</body>
</html>
